<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/style.css">

<title>Inscription Horizon</title>
</head>

<div class="login-container">
<body>

<h1>Créer un compte Horizon</h1>

<input id="username" placeholder="Pseudo">

<br><br>

<input id="email" placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Mot de passe">

<br><br>

<button onclick="register()">
Créer le compte
</button>

<script>

async function register(){

const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response =
await fetch("/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
email,
password
})

});

const data =
    await response.json();

if(data.success){

    const loginResponse =
        await fetch("/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                email,
                password

            })

        });

    const loginData =
        await loginResponse.json();

    localStorage.setItem(
        "token",
        loginData.token
    );

    localStorage.setItem(
        "username",
        loginData.username
    );

    window.location.href = "/";

}else{

    alert(data.error);

}

}

</script>

</body>
</div>

</html>
