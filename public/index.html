<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horizon</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>🌅 Horizon</h1>

        <button onclick="logout()">
            Déconnexion
        </button>

    </div>

    <p id="welcome"></p>

    <div class="create-post">

        <textarea
            id="content"
            placeholder="Exprime toi sur Horizon...">
        </textarea>

        <button onclick="publish()">
            Publier
        </button>

    </div>

    <div id="feed"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js?v=20"></script>

</body>

</html>
