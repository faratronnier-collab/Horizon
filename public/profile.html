<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Horizon</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>


<h1>👤 Mon Profil</h1>

<div id="profile"></div>

<h2>Modifier mon profil</h2>

<input
id="avatar"
placeholder="URL de l'image">

<br><br>

<textarea
id="bio"
placeholder="Ta bio">
</textarea>

<br><br>

<button onclick="saveProfile()">
Enregistrer
</button>

</div>

<script>

async function loadProfile(){

    const params =
new URLSearchParams(
window.location.search
);

const username =
params.get("user")
||
localStorage.getItem(
"username"
);
    const response =
        await fetch(
            `/profile/${username}`
        );

    const profile =
        await response.json();
        console.log(profile.avatar);
    document.getElementById(
        "profile"
    ).innerHTML = `

        <img
        src="${
            profile.avatar ||
            `https://ui-avatars.com/api/?name=${profile.username}&background=random`
        }"
        class="avatar-large">

        <h2>${profile.username}</h2>

        <p>
        ${profile.bio || "Aucune bio"}
        </p>
        <p>

📝 Publications :

${posts.length}

</p>

<hr>

${posts.map(post => `
<div class="post">

${post.content}

</div>
`).join("")}

    `;

    document.getElementById(
        "bio"
    ).value =
    profile.bio || "";

    document.getElementById(
        "avatar"
    ).value =
    profile.avatar || "";

}

async function saveProfile(){

    await fetch(
        "/profile",
        {

            method:"PUT",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                username:
                localStorage.getItem(
                    "username"
                ),

                bio:
                document.getElementById(
                    "bio"
                ).value,

                avatar:
                document.getElementById(
                    "avatar"
                ).value

            })

        }
    );

    loadProfile();

}

loadProfile();

</script>

</body>

</html>
