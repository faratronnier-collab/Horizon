<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Horizon</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

<h1>👤 Mon Profil</h1>

<div id="profile"></div>

<h2>Modifier mon profil</h2>

<input
id="avatar"
placeholder="URL de l'image">

<br><br>

<textarea
id="bio"
placeholder="Ta bio">
</textarea>

<br><br>

<button onclick="saveProfile()">
Enregistrer
</button>

</div>

<script>

async function loadProfile(){

    const username =
        localStorage.getItem(
            "username"
        );

    const response =
        await fetch(
            `/profile/${username}`
        );

    const user =
        await response.json();
        console.log(user.avatar);
    document.getElementById(
        "profile"
    ).innerHTML = `

        <img
        src="${
            user.avatar ||
            `https://ui-avatars.com/api/?name=${user.username}&background=random`
        }"
        class="avatar-large">

        <h2>${user.username}</h2>

        <p>
        ${user.bio || "Aucune bio"}
        </p>

    `;

    document.getElementById(
        "bio"
    ).value =
    user.bio || "";

    document.getElementById(
        "avatar"
    ).value =
    user.avatar || "";

}

async function saveProfile(){

    await fetch(
        "/profile",
        {

            method:"PUT",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                username:
                localStorage.getItem(
                    "username"
                ),

                bio:
                document.getElementById(
                    "bio"
                ).value,

                avatar:
                document.getElementById(
                    "avatar"
                ).value

            })

        }
    );

    loadProfile();

}

loadProfile();

</script>

</body>

</html>
