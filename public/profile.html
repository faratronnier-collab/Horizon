<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Horizon</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

<h1>👤 Mon Profil</h1>

<div id="profile"></div>

<h2>Modifier mon profil</h2>

<input
id="avatar"
placeholder="URL de l'image">

<br><br>

<textarea
id="bio"
placeholder="Ta bio">
</textarea>

<br><br>

<button onclick="saveProfile()">
Enregistrer
</button>

</div>

<script>

async function loadProfile(){

    const username =
        localStorage.getItem(
            "username"
        );

    if (!username) {
        document.getElementById("profile").textContent =
            "Utilisateur non connecté.";
        return;
    }

    try {
        const response =
            await fetch(
                `/profile/${encodeURIComponent(username)}`
            );

        if (!response.ok) {
            throw new Error("Impossible de charger le profil");
        }

        const user =
            await response.json();

        const avatarUrl =
            user.avatar && user.avatar.trim() !== ""
                ? user.avatar
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(user.username || "Utilisateur")}&background=random`;

        const profile = document.getElementById("profile");
        profile.replaceChildren();

        const image = document.createElement("img");
        image.src = avatarUrl;
        image.alt = user.username || "Utilisateur";

        const heading = document.createElement("h2");
        heading.textContent = user.username || "Utilisateur";

        const bio = document.createElement("p");
        bio.textContent = user.bio || "Aucune bio";

        profile.append(image, heading, bio);

        document.getElementById(
            "bio"
        ).value =
        user.bio || "";

        document.getElementById(
            "avatar"
        ).value =
        user.avatar || "";
    } catch (error) {
        document.getElementById("profile").textContent =
            "Erreur lors du chargement du profil.";
        console.error(error);
    }

}

async function saveProfile(){

    await fetch(
        "/profile",
        {

            method:"PUT",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                username:
                localStorage.getItem(
                    "username"
                ),

                bio:
                document.getElementById(
                    "bio"
                ).value,

                avatar:
                document.getElementById(
                    "avatar"
                ).value

            })

        }
    );

    loadProfile();

}

loadProfile();

</script>

</body>

</html>
