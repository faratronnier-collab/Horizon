<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Connexion Horizon</title>
</head>

<body>

<h1>🌅 Connexion Horizon</h1>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Mot de passe">

<br><br>

<button onclick="login()">
Connexion
</button>

<script>

async function login(){

    const response =
        await fetch("/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                email:
                document.getElementById("email").value,

                password:
                document.getElementById("password").value

            })

        });

    const data =
        await response.json();

    if(data.token){

    localStorage.setItem(
        "token",
        data.token
    );

    localStorage.setItem(
        "username",
        data.username
    );

    window.location.href = "/";

}else{

    alert(
        data.error
    );

}

}

</script>

</body>
</html>
