<!DOCTYPE html>
<html>

<body>

<h1>Connexion Horizon</h1>

<input id="email">

<br><br>

<input
id="password"
type="password">

<br><br>

<button onclick="login()">
Connexion
</button>

<script>

async function login(){

const response =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:
document.getElementById("email").value,

password:
document.getElementById("password").value

})

});

const data =
await response.json();

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"username",
data.username
);

alert("Connecté");

}

</script>

</body>

</html>
